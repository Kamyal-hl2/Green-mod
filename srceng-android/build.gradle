// =============================================================================
// Файл: build.gradle
// Назначение: Конфигурация сборки APK лаунчера Green Engine v2
//
// Поддерживает:
//   - armeabi-v7a (32-bit ARM) — для Android 4.2+ (API 17+)
//   - arm64-v8a (64-bit ARM) — для Android 5.0+ (API 21+)
//
// Универсальный APK содержит оба ABI. Android сам выбирает нужный.
//
// Сборка:
//   ./gradlew assembleDebug   — отладочная сборка
//   ./gradlew assembleRelease — релизная сборка (нужен keystore)
// =============================================================================

apply plugin: 'com.android.application'

android {
    namespace 'com.valvesoftware.source'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.valvesoftware.source"
        minSdkVersion 17       // Android 4.2 Jelly Bean — минимальная версия
        targetSdkVersion 34    // Android 14 — целевая версия

        // Поддерживаемые архитектуры:
        // armeabi-v7a — 32-bit ARM (большинство старых/дешёвых телефонов)
        // arm64-v8a   — 64-bit ARM (все современные телефоны с 2016 года)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            // .so-файлы кладутся в libs/<abi>/ (архитектура-специфичные)
            // Gradle автоматически определяет ABI из подпапок
            jniLibs.srcDirs = ['libs']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Debug-сборка: включаем debuggable для отладки
            debuggable true
        }
        release {
            // Release-сборка: минификация не нужна для нативного движка
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
    }

    // Не позволяет AGP изменять наши .so-файлы
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lintOptions {
        abortOnError false
    }

    // Показываем какие ABI включены в APK
    applicationVariants.configureEach { variant ->
        variant.doLast {
            def abiList = []
            variant.outputs.each { output ->
                def metadata = output.getMetadata()
                if (metadata != null) {
                    abiList.add(metadata.getABI())
                }
            }
        }
    }
}
