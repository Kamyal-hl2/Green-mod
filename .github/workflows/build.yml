name: Build Green-mod APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-32bit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK r21e
      run: |
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
        unzip -q android-ndk-r21e-linux-x86_64.zip
        echo "ANDROID_NDK_HOME=/tmp/android-ndk-r21e" >> $GITHUB_ENV
        echo "NDK_HOME=/tmp/android-ndk-r21e" >> $GITHUB_ENV

    - name: Prepare waf
      run: |
        cd source-engine
        git submodule init && git submodule update --recursive
        chmod +x waf

    - name: Build LuaJIT for armeabi-v7a
      run: |
        cd source-engine
        chmod +x scripts/build-luajit-android.sh
        ANDROID_NDK_HOME=/tmp/android-ndk-r21e ./scripts/build-luajit-android.sh arm 21
        echo "=== lib/android/arm/ ==="
        ls -la lib/android/arm/libluajit.a

    - name: Build native engine (armeabi-v7a / 32-bit)
      run: |
        cd source-engine
        python3 waf configure -T release --android=armeabi-v7a,clang,21 --togles --disable-warns --build-games=garrysmod
        python3 waf build -j$(nproc)

    - name: Copy armeabi-v7a .so files
      run: |
        mkdir -p srceng-android/libs/armeabi-v7a
        find source-engine/build/ -name "*.so" -exec cp {} srceng-android/libs/armeabi-v7a/ \;
        echo "=== armeabi-v7a libraries ==="
        ls -la srceng-android/libs/armeabi-v7a/

    - name: Build APK
      run: |
        cd srceng-android
        chmod +x gradlew
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Green-mod-v2
        path: srceng-android/build/outputs/apk/debug/Green-mod-v2.apk
        if-no-files-found: error
