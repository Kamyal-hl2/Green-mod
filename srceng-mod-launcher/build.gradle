// =============================================================================
// Файл: build.gradle
// Назначение: Конфигурация сборки Android-приложения (мод-лаунчер для Green Engine)
//
// Этот файл определяет:
//   - compileSdkVersion 34 — компиляция с Android 14 (API 34)
//   - minSdkVersion 17 — минимальная версия Android 4.2 (Jelly Bean)
//   - targetSdkVersion 34 — целевая версия Android 14
//
// ВАЖНО: Перед сборкой замените:
//   - package name (com.valvesoftware.source) на свой
//   - MOD_REPLACE_ME в LauncherActivity.java на имя мода
//   - PACK_NAME в LauncherActivity.java на имя VPK-файла
//
// Сборка: ./gradlew assembleDebug (или assembleRelease)
// =============================================================================

apply plugin: 'com.android.application'

android {
    // namespace — пакет для R.java (autogenerated). Должен совпадать с package в manifest
    namespace 'com.valvesoftware.source'
    compileSdkVersion 34 // компилируем с API 34 (Android 14)

    defaultConfig {
        applicationId "com.valvesoftware.source" // уникальный ID приложения в Google Play
        minSdkVersion 17 // минимальный Android 4.2 (Jelly Bean, 2012)
        targetSdkVersion 34 // целевой Android 14 (2023)
    }

    sourceSets {
        main {
            // Пути к исходникам (стандартная структура Android-проекта)
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs'] // нативные .so-библиотеки (SDL2, движок)
        }
    }

    buildTypes {
        debug {
            // Debug-сборка: использует дефолтный debug keystore
        }
    }

    // lintOptions: отключаем abortOnError чтобы не прерывать сборку
    // из-за не критичных предупреждений линтера
    lintOptions {
        abortOnError false
    }
}
